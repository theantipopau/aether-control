# Runs the test suite on every push/PR.
#
# Deliberately `dotnet test` on the test project only, not a solution build: the WinUI 3 head
# (AetherControl.App) needs Visual Studio's own MSBuild with the Windows application development
# workload (`Microsoft.Build.Packaging.Pri.Tasks.dll` is missing from plain dotnet SDKs — see
# ROADMAP Phase 37), which a runner's `dotnet build` doesn't have either. dotnet test builds
# Core/Data/Services/Tests transitively, and that's where every test lives.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build + tests (Core/Data/Services)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Phase 54: follows global.json (.NET 10) instead of a hardcoded 8.0.x.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run test suite
        run: dotnet test tests/AetherControl.Tests -c Release --logger "console;verbosity=normal"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          retention-days: 7

  app-build:
    name: Build WinUI head
    runs-on: windows-latest
    # The App project can't build under plain `dotnet build` anywhere — it needs Visual
    # Studio's own MSBuild with the Windows application development workload (PRI tasks,
    # XAML compiler LocalAssembly — see ROADMAP Phase 37). windows-latest now ships
    # MSBuild 18+, which also resolves the .NET 10 SDK that local VS2022 (MSBuild 17)
    # cannot. Went green in Phase 64, so head breaks fail CI like everything else — and
    # the unpackaged Release output is uploaded so it can be downloaded and run for testing.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build AetherControl.App (Release, x64)
        run: msbuild src/AetherControl.App/AetherControl.App.csproj -restore -p:Configuration=Release -p:Platform=x64 -v:minimal

      - name: Upload unpackaged exe
        uses: actions/upload-artifact@v4
        with:
          name: AetherControl-x64-Release
          path: src/AetherControl.App/bin/x64/Release/net10.0-windows10.0.19041.0/
          retention-days: 14
